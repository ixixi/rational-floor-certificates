name: Publish animation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - slides/paper-animation-ja.html
      - slides/paper-animation-ja-narration.mp3
      - slides/one-step-animation-en.html
      - slides/one-step-animation-en-narration.mp3
      - slides/one-step-animation-ja.html
      - slides/one-step-animation-ja-narration.mp3
      - slides/word-label-animation-en.html
      - slides/word-label-animation-en-narration.mp3
      - slides/word-label-animation-ja.html
      - slides/word-label-animation-ja-narration.mp3
      - slides/frontier-animation-en.html
      - slides/frontier-animation-en-narration.mp3
      - slides/frontier-animation-ja.html
      - slides/frontier-animation-ja-narration.mp3
      - slides/verification-animation-en.html
      - slides/verification-animation-en-narration.mp3
      - slides/verification-animation-ja.html
      - slides/verification-animation-ja-narration.mp3
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          # the Japanese explainer lives under ja/explainer/ (the top page is the project page, assembled at the end)
          mkdir -p _site/ja/explainer
          cp slides/paper-animation-ja.html _site/ja/explainer/index.html
          cp slides/paper-animation-ja-narration.mp3 _site/ja/explainer/paper-animation-ja-narration.mp3
          cp site/og-explainer-ja.png _site/ja/explainer/og.png
          # the English animation of the one-step method lives under en/one-step/
          mkdir -p _site/en/one-step
          cp slides/one-step-animation-en.html _site/en/one-step/index.html
          cp slides/one-step-animation-en-narration.mp3 _site/en/one-step/one-step-animation-en-narration.mp3
          cp site/og-one-step-en.png _site/en/one-step/og.png
          # the Japanese version of the same animation lives under ja/one-step/
          mkdir -p _site/ja/one-step
          cp slides/one-step-animation-ja.html _site/ja/one-step/index.html
          cp slides/one-step-animation-ja-narration.mp3 _site/ja/one-step/one-step-animation-ja-narration.mp3
          cp site/og-one-step-ja.png _site/ja/one-step/og.png
          # the English animation of the word-labelled method lives under en/word-label/
          mkdir -p _site/en/word-label
          cp slides/word-label-animation-en.html _site/en/word-label/index.html
          cp slides/word-label-animation-en-narration.mp3 _site/en/word-label/word-label-animation-en-narration.mp3
          cp site/og-word-label-en.png _site/en/word-label/og.png
          # the Japanese version of the same animation lives under ja/word-label/
          mkdir -p _site/ja/word-label
          cp slides/word-label-animation-ja.html _site/ja/word-label/index.html
          cp slides/word-label-animation-ja-narration.mp3 _site/ja/word-label/word-label-animation-ja-narration.mp3
          cp site/og-word-label-ja.png _site/ja/word-label/og.png
          # the English animation of waiting times, limits and open problems lives under en/frontier/
          mkdir -p _site/en/frontier
          cp slides/frontier-animation-en.html _site/en/frontier/index.html
          cp slides/frontier-animation-en-narration.mp3 _site/en/frontier/frontier-animation-en-narration.mp3
          cp site/og-frontier-en.png _site/en/frontier/og.png
          # the Japanese version of the same animation lives under ja/frontier/
          mkdir -p _site/ja/frontier
          cp slides/frontier-animation-ja.html _site/ja/frontier/index.html
          cp slides/frontier-animation-ja-narration.mp3 _site/ja/frontier/frontier-animation-ja-narration.mp3
          cp site/og-frontier-ja.png _site/ja/frontier/og.png
          # the English animation of verification and Lean lives under en/verification/
          mkdir -p _site/en/verification
          cp slides/verification-animation-en.html _site/en/verification/index.html
          cp slides/verification-animation-en-narration.mp3 _site/en/verification/verification-animation-en-narration.mp3
          cp site/og-verification-en.png _site/en/verification/og.png
          # the Japanese version of the same animation lives under ja/verification/
          mkdir -p _site/ja/verification
          cp slides/verification-animation-ja.html _site/ja/verification/index.html
          cp slides/verification-animation-ja-narration.mp3 _site/ja/verification/verification-animation-ja-narration.mp3
          cp site/og-verification-ja.png _site/ja/verification/og.png
          # icons shared by the whole site
          cp site/favicon.svg site/favicon.ico site/apple-touch-icon.png _site/
          # the project page: English at the top, Japanese under ja/, and en/ pointing to the top
          cp site/index.html _site/index.html
          cp site/og-project-en.png _site/og.png
          cp site/ja/index.html _site/ja/index.html
          cp site/og-project-ja.png _site/ja/og.png
          cat > _site/en/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Rational floor certificates</title>
          <link rel="canonical" href="https://ixixi.github.io/rational-floor-certificates/">
          <link rel="icon" href="../favicon.svg" type="image/svg+xml">
          <meta http-equiv="refresh" content="0; url=../">
          </head>
          <body>
          <p><a href="../">Rational floor certificates: the project page</a></p>
          </body>
          </html>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
